<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Faceshopping – Musikkens Dag Oslo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #06060a;
      --fg: #e8e4ff;
      --accent: #c800ff;
      --accent2: #ff003c;
      --yellow: #ffe600;
      --dim: #44445a;
      --noise-opacity: 0.06;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      position: relative;
    }

    /* Film grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: var(--noise-opacity);
      pointer-events: none;
      z-index: 100;
    }

    /* ── HERO IMAGE ── */
    .hero {
      position: relative;
      width: 100%;
      max-height: 480px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .hero img {
      width: 100%;
      display: block;
      object-fit: cover;
      object-position: center top;
      filter: contrast(1.15) saturate(0.6) brightness(0.75);
      mix-blend-mode: normal;
    }

    /* Duotone overlay on image */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        160deg,
        rgba(200, 0, 255, 0.35) 0%,
        rgba(255, 0, 60, 0.2) 60%,
        transparent 100%
      );
      mix-blend-mode: screen;
      z-index: 1;
    }

    /* Fade to black at bottom */
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60%;
      background: linear-gradient(to bottom, transparent, var(--bg));
      z-index: 2;
    }

    /* Band name over image */
    .hero-title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 3;
      padding: 0 1.5rem 0.5rem;
    }

    .hero-title h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 18vw, 10rem);
      line-height: 0.88;
      letter-spacing: 0.02em;
      color: #fff;
      text-shadow:
        4px 4px 0 var(--accent2),
        -2px -2px 0 var(--accent),
        0 0 40px rgba(200,0,255,0.5);
      position: relative;
    }

    /* Aggressive glitch on h1 */
    .hero-title h1::before,
    .hero-title h1::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      font-family: 'Bebas Neue', sans-serif;
      font-size: inherit;
      line-height: inherit;
    }

    .hero-title h1::before {
      color: var(--accent);
      animation: glitch-a 4s steps(1) infinite;
      clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%);
    }

    .hero-title h1::after {
      color: var(--accent2);
      animation: glitch-b 4s steps(1) infinite;
      clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%);
    }

    @keyframes glitch-a {
      0%,89%  { transform: none; opacity: 0; }
      90%     { transform: translateX(-6px); opacity: 0.8; }
      92%     { transform: translateX(4px); opacity: 0.8; }
      94%,100%{ transform: none; opacity: 0; }
    }

    @keyframes glitch-b {
      0%,91%  { transform: none; opacity: 0; }
      92%     { transform: translateX(6px); opacity: 0.7; }
      94%     { transform: translateX(-3px); opacity: 0.7; }
      96%,100%{ transform: none; opacity: 0; }
    }

    /* ── MAIN CONTENT ── */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 700px;
      padding: 0 1.5rem 3rem;
      text-align: center;
    }

    /* Scratchy divider */
    .divider {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent2), var(--accent), transparent);
      margin: 0.5rem 0 1.5rem;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: -3px; left: 20%;
      width: 30%;
      height: 1px;
      background: var(--accent2);
      opacity: 0.5;
    }

    .event-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--yellow);
      padding: 0.25rem 0.7rem;
      margin-bottom: 0.6rem;
      clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
    }

    .venue-line {
      font-size: 0.8rem;
      color: var(--dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    .venue-line strong {
      color: var(--fg);
    }

    /* ── COUNTDOWN ── */
    .countdown-wrap {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(200, 0, 255, 0.25);
      border-top: 2px solid var(--accent);
      padding: 2rem 1rem 1.5rem;
      margin-bottom: 2rem;
      position: relative;
    }

    .countdown-wrap::before {
      content: 'NEDTELLING';
      position: absolute;
      top: -0.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      color: var(--accent);
      background: var(--bg);
      padding: 0 0.5rem;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 0;
      flex-wrap: nowrap;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 130px;
      padding: 0 0.5rem;
      border-right: 1px solid rgba(255,255,255,0.07);
    }

    .unit:last-child { border-right: none; }

    .unit-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 12vw, 5.5rem);
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 20px var(--accent), 2px 2px 0 var(--accent2);
      transition: color 0.1s;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
    }

    .unit-value.tick {
      color: var(--accent);
      text-shadow: 0 0 30px var(--accent), 3px 3px 0 var(--accent2);
    }

    .unit-label {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dim);
      margin-top: 0.3rem;
    }

    /* ── INFO BAR ── */
    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 1rem 0;
      border-top: 1px solid rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 1.5rem;
    }

    .info-item {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      flex: 1;
      min-width: 100px;
      text-align: center;
    }

    .info-item strong {
      display: block;
      font-size: 0.95rem;
      color: var(--fg);
      letter-spacing: 0.02em;
      margin-bottom: 0.1rem;
    }

    /* ── GENRE TAGS ── */
    .genre-tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 1.2rem;
    }

    .genre-tag {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent2);
      border: 1px solid rgba(255, 0, 60, 0.4);
      padding: 0.2rem 0.6rem;
      clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
    }

    /* ── DONE ── */
    #done-msg {
      display: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 8vw, 3.5rem);
      color: var(--yellow);
      letter-spacing: 0.1em;
      text-shadow: 3px 3px 0 var(--accent2), 0 0 30px var(--yellow);
      animation: pulse 0.8s ease-in-out infinite alternate;
      padding: 2rem 0;
    }

    @keyframes pulse {
      from { opacity: 0.8; transform: scale(0.98); }
      to   { opacity: 1;   transform: scale(1.02); }
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>

  <!-- HERO -->
  <div class="hero">
    <img src="https://nrk-urort-prod.s3.amazonaws.com/620x349/86bbd067-ca9d-4871-9969-f4eca61a4a5c" alt="Faceshopping" />
    <div class="hero-title">
      <h1 data-text="FACESHOPPING">FACESHOPPING</h1>
    </div>
  </div>

  <!-- MAIN -->
  <div class="container">

    <div class="divider"></div>

    <div class="event-badge">Musikkens Dag Oslo 2026</div>
    <p class="venue-line"><strong>Pokalen / Lille Vulkan</strong> · Vulkan Arena · Oslo</p>

    <div class="countdown-wrap">
      <div class="countdown" id="countdown">
        <div class="unit">
          <div class="unit-value" id="days">--</div>
          <div class="unit-label">Dager</div>
        </div>
        <div class="unit">
          <div class="unit-value" id="hours">--</div>
          <div class="unit-label">Timer</div>
        </div>
        <div class="unit">
          <div class="unit-value" id="minutes">--</div>
          <div class="unit-label">Minutter</div>
        </div>
        <div class="unit">
          <div class="unit-value" id="seconds">--</div>
          <div class="unit-label">Sekunder</div>
        </div>
      </div>
      <div id="done-msg">⚡ DET ER TID — ENJOY THE SHOW ⚡</div>
    </div>

    <div class="info-bar">
      <div class="info-item">
        <strong>Lørdag 6. juni</strong>
        Dato
      </div>
      <div class="info-item">
        <strong>20:15 – 20:45</strong>
        Tid
      </div>
      <div class="info-item">
        <strong>Gratis</strong>
        Inngang
      </div>
    </div>

    <div class="genre-tags">
      <span class="genre-tag">Shoegaze</span>
      <span class="genre-tag">Noise Rock</span>
      <span class="genre-tag">Alt-Rock</span>
      <span class="genre-tag">Post-Rock</span>
      <span class="genre-tag">Glitch</span>
    </div>

  </div>

  <script>
    const target = new Date('2026-06-06T20:15:00');

    const daysEl    = document.getElementById('days');
    const hoursEl   = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const doneEl    = document.getElementById('done-msg');
    const cdEl      = document.getElementById('countdown');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick(el, newVal) {
      if (el.textContent === newVal) return;
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
      el.textContent = newVal;
      setTimeout(() => el.classList.remove('tick'), 120);
    }

    function update() {
      const diff = target - new Date();
      if (diff <= 0) {
        cdEl.style.display = 'none';
        doneEl.style.display = 'block';
        return;
      }
      tick(daysEl,    pad(Math.floor(diff / 86400000)));
      tick(hoursEl,   pad(Math.floor((diff % 86400000) / 3600000)));
      tick(minutesEl, pad(Math.floor((diff % 3600000)  / 60000)));
      tick(secondsEl, pad(Math.floor((diff % 60000)    / 1000)));
    }

    update();
    setInterval(update, 250);
  </script>
</body>
</html>
